<html lang="ja">
<head>

<title>3D戦車バトル v4</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#222;font-family:sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{width:100%;height:100%;display:block;outline:none}
#hud{position:fixed;top:8px;left:8px;right:8px;color:#fff;font-weight:bold;text-shadow:0 1px 3px #000;display:flex;justify-content:space-between;pointer-events:none;font-size:16px}
#hp{width:140px;height:12px;background:#400;border:1px solid #fff;margin-top:4px}
#hpb{height:100%;background:#4f4;width:100%}
#over{position:fixed;inset:0;background:rgba(0,0,0,.7);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:28px;gap:16px}
button{font-size:20px;padding:10px 28px;border-radius:8px;border:0;background:#4a8;color:#fff}
.stick{position:fixed;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4)}
.knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6)}
#cross{left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(255,255,255,.7);border-radius:50%;position:fixed;pointer-events:none;z-index:3;box-sizing:content-box}
#fire{position:fixed;right:34px;bottom:50px;width:84px;height:84px;border-radius:50%;background:rgba(255,80,60,.45);border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:none}
#sl{left:20px}#sr{right:20px}
#reload{position:fixed;right:34px;bottom:146px;width:88px;text-align:center;color:#fff;font:bold 12px sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}
#rlbar{height:9px;border:1px solid #fff;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:2px}
#rlfill{display:block;height:100%;width:100%;background:#4f4}
</style>
<style>
#title{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;text-align:center;
 background:linear-gradient(#4d77ab 0%,#9bb4cc 38%,#d9ccb0 62%,#b98d57 62.1%,#8a6638 100%);transition:opacity .6s}
#title svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;z-index:-1}
#title h1{margin:0;font-size:min(13vw,72px);letter-spacing:.08em;text-shadow:0 3px 10px rgba(0,0,0,.6)}
#title .sub{margin:.4em 0 1.6em;font-size:min(4.2vw,20px);letter-spacing:.3em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#title button{font-size:22px;padding:.7em 2.6em;border:2px solid #fff;border-radius:999px;background:rgba(150,50,40,.85);color:#fff;letter-spacing:.2em}
#title .veh{margin:-1em 0 1.6em;font-size:min(3.6vw,16px);letter-spacing:.15em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#title .dev{position:absolute;bottom:14px;font-size:12px;opacity:.85;text-shadow:0 1px 4px #000}
#ld{display:none;width:min(70vw,360px)}
#ldbar{height:12px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.35)}
#ldbar i{display:block;height:100%;width:0;background:#ffd36a}
#ldtx{margin-top:.6em;font-size:14px;text-shadow:0 1px 4px #000}
</style></head>

<script>
// 起動エラーを画面に表示(コンソールが無効化されているため)
const showErr=m=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;top:90px;z-index:200;background:rgba(0,0,0,.8);color:#ff8;font:12px monospace;padding:8px;white-space:pre-wrap';d.textContent='ERROR: '+m;document.body.appendChild(d);};
addEventListener('error',e=>showErr(e.message+' @'+e.lineno));addEventListener('unhandledrejection',e=>showErr(String(e.reason&&e.reason.stack||e.reason)));
const MOBILE=matchMedia('(pointer:coarse)').matches;
const setLoad=(p,t)=>{document.getElementById('ldfill').style.width=Math.round(p*100)+'%';document.getElementById('ldtx').textContent=t+'  '+Math.round(p*100)+'%';};
const tick=(p,t)=>{setLoad(p,t);return new Promise(r=>setTimeout(r,30));};
let booted=false;
const stat=document.createElement('div');stat.id='stat';stat.style.cssText='position:absolute;top:8px;left:8px;right:8px;font:11px monospace;color:#fff;text-shadow:0 1px 3px #000;text-align:left;z-index:5;pointer-events:none';
stat.textContent='JS OK / エンジン展開中…';
document.getElementById('title').appendChild(stat);
const startGame=e=>{
  if(e&&e.preventDefault)e.preventDefault();
  if(booted)return;booted=true;
  stat.textContent='START受付 / BABYLON: '+(typeof BABYLON==='undefined'?'未読込!':'OK');
  document.getElementById('startBtn').style.display='none';document.getElementById('ld').style.display='block';
  setTimeout(()=>Promise.resolve(window.__engineP).then(()=>bootGame()).catch(e=>{booted=false;showErr(String(e&&e.stack||e));document.getElementById('startBtn').style.display='';document.getElementById('ld').style.display='none';}),50);
};
{const b=document.getElementById('startBtn');b.addEventListener('click',startGame);b.addEventListener('touchend',startGame,{passive:false});b.addEventListener('pointerup',startGame);}

async function bootGame(){
await tick(.02,'エンジンを準備中');
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,false,{powerPreference:'high-performance'});
const RES=2; // 描画解像度 = CSSピクセル1つあたりの描画ピクセル数(端末のdevicePixelRatioが上限)。3=最高画質・重い / 2=高画質 / 1.5=標準 / 1=軽い
const MAXPX=MOBILE?2.6e6:4e6; // 総ピクセル数の上限(大画面で重くなりすぎないように)
const applyRes=()=>{
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;
  const r=Math.max(1,Math.min(RES,dpr,Math.sqrt(MAXPX/(w*h)))); // 描画倍率(1未満にはしない)
  const lv=1/r; // Babylonのscalingレベルは「小さいほど高解像度」(0.5=2倍)
  if(Math.abs(engine.getHardwareScalingLevel()-lv)>.001)engine.setHardwareScalingLevel(lv);
};
applyRes();
const scene=new BABYLON.Scene(engine);scene.skipPointerMovePicking=true;
scene.clearColor=new BABYLON.Color4(.8,.77,.7,1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=0.0026;scene.fogColor=new BABYLON.Color3(.8,.77,.7);
const cam=new BABYLON.FreeCamera('cam',new BABYLON.Vector3(0,22,-18),scene);
const hl=new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene);hl.intensity=.7;
const sun=new BABYLON.DirectionalLight('s',new BABYLON.Vector3(-.5,-1,-.4),scene);sun.position=new BABYLON.Vector3(40,80,40);sun.intensity=.9;sun.diffuse=new BABYLON.Color3(1,.93,.8);
sun.autoUpdateExtends=false;sun.autoCalcShadowZBounds=false;sun.orthoLeft=-55;sun.orthoRight=55;sun.orthoTop=55;sun.orthoBottom=-55;sun.shadowMinZ=1;sun.shadowMaxZ=320;
const sg=new BABYLON.ShadowGenerator(MOBILE?256:1024,sun);sg.usePoissonSampling=!MOBILE;
if(MOBILE)scene.shadowsEnabled=false; // スマホは影なし(シェーダー軽量化)

const B=150;
await tick(.08,'テクスチャを生成中(地面)');
// ===== 手続き型テクスチャ(ノイズからCanvasで生成) =====
const T={};
function texMat(d,n,c){const m=new BABYLON.StandardMaterial('tm',scene);m.diffuseTexture=d;if(n&&!MOBILE)m.bumpTexture=n;m.diffuseColor=c||BABYLON.Color3.White();m.specularColor=new BABYLON.Color3(.05,.05,.05);return m;}
{
 const rnd=seed=>{let s=seed>>>0||1;return()=>((s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296);};
 const sm=t=>t*t*(3-2*t);
 function vnoise(N,f,seed){ // タイル可能な値ノイズ
  const r=rnd(seed*7919+13),g=new Float32Array(f*f);for(let i=0;i<g.length;i++)g[i]=r();
  const o=new Float32Array(N*N);
  for(let y=0;y<N;y++){const fy=y/N*f,y0=Math.floor(fy),ty=sm(fy-y0),ya=(y0%f)*f,yb=((y0+1)%f)*f;
   for(let x=0;x<N;x++){const fx=x/N*f,x0=Math.floor(fx),tx=sm(fx-x0),xa=x0%f,xb=(x0+1)%f;
    const top=g[ya+xa]+(g[ya+xb]-g[ya+xa])*tx,bot=g[yb+xa]+(g[yb+xb]-g[yb+xa])*tx;o[y*N+x]=top+(bot-top)*ty;}}
  return o;}
 function fbm(N,f,oct,seed){const o=new Float32Array(N*N);let a=.5,tot=0;
  for(let i=0;i<oct;i++){const n=vnoise(N,f<<i,seed+i*31);for(let k=0;k<o.length;k++)o[k]+=n[k]*a;tot+=a;a*=.5;}
  for(let k=0;k<o.length;k++)o[k]/=tot;return o;}
 const clamp=v=>v<0?0:v>1?1:v;
 function paint(N,fn){const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N),d=im.data;
  for(let i=0;i<N*N;i++){const q=fn(i,i%N,(i/N)|0);d[i*4]=clamp(q[0])*255;d[i*4+1]=clamp(q[1])*255;d[i*4+2]=clamp(q[2])*255;d[i*4+3]=(q[3]===undefined?1:q[3])*255;}
  x.putImageData(im,0,0);return c;}
 function normalMap(N,h,str){return paint(N,(i,x,y)=>{const l=h[y*N+(x+N-1)%N],r=h[y*N+(x+1)%N],u=h[((y+N-1)%N)*N+x],d=h[((y+1)%N)*N+x];
  const nx=(l-r)*str,ny=(u-d)*str,len=Math.hypot(nx,ny,1);return [nx/len*.5+.5,ny/len*.5+.5,1/len*.5+.5];});}
 function mk(c,u,v,aniso){const t=new BABYLON.DynamicTexture('t',c,scene,true);t.uScale=u;t.vScale=v;t.wrapU=t.wrapV=1;t.anisotropicFilteringLevel=MOBILE?1:Math.min(aniso||4,4);t.update();return t;}
 // 砂地:粒・斑点・礫
 {const N=512,a=fbm(N,8,MOBILE?4:5,11),g=vnoise(N,MOBILE?128:256,3),m=vnoise(N,64,4),pb=vnoise(N,40,7);
  T.sand=mk(paint(N,i=>{let v=1.04+(a[i]-.5)*.12+(g[i]-.5)*.16+(m[i]-.5)*.09;if(pb[i]>.78)v*=.78+(pb[i]-.78)*.6;if(g[i]>.95)v+=.06;return [v,v*.97,v*.92];}),70,70,8);
  const N2=256,h1=vnoise(N2,64,5),h2=vnoise(N2,32,6),h3=fbm(N2,6,3,8),hh=new Float32Array(N2*N2);
  for(let y=0;y<N2;y++)for(let x=0;x<N2;x++){const i=y*N2+x;hh[i]=h1[i]*.4+h2[i]*.35+.35*Math.sin((x/N2*12+h3[i]*3)*6.283);}
  T.sandN=mk(normalMap(N2,hh,2.2),23,23,8);}
 await tick(.25,'テクスチャを生成中(岩)');
 // 砂岩:地層の縞とひび割れ
 {const N=512,lo=fbm(N,3,3,21),gr=vnoise(N,128,22),cr=vnoise(N,10,23),hh=new Float32Array(N*N);
  T.rock=mk(paint(N,(i,x,y)=>{const by=y/N,band=Math.sin(by*58+lo[i]*9)*.5+.5,fine=Math.sin(by*230+lo[i]*5)*.5+.5;
   let r=.95-band*.18-fine*.05,g=.8-band*.24-fine*.06,b=.58-band*.2-fine*.05;const k=1.12+(gr[i]-.5)*.3;
   if(Math.abs(cr[i]-.5)<.018){r*=.55;g*=.55;b*=.55;}hh[i]=band*.5+gr[i]*.5;return [r*k,g*k,b*k];}),2,1,8);
  T.rockN=mk(normalMap(N,hh,3),2,1,8);}
 await tick(.38,'テクスチャを生成中(戦車の迷彩)');
 // 迷彩(緑/茶/黒、使い込んだ塗装のムラ付き)
 function camo(c0,c1,c2,seed,w){const N=512,n=fbm(N,4,4,seed),g=vnoise(N,Math.min(200,N),seed+5),ws=vnoise(N,24,seed+9);
  return mk(paint(N,i=>{const v=n[i];let c=v<.36?c0:v<.68?c1:c2;
   const e=Math.min(Math.abs(v-.36),Math.abs(v-.68));if(e<.012)c=[(c[0]+c1[0])/2,(c[1]+c1[1])/2,(c[2]+c1[2])/2];

  dec:9,      // 減速
  reload:3.0, // 装填秒数(自動装填なし・装填手による手動装填)
  dmg:2,      // 120mm滑腔砲の1発の威力(敵HP 2 = 初期は一撃)
  hp:8        // 複合装甲による高い防護力
};
const SHV=75,SHG=18; // 自弾の初速と重力(120mm砲の高初速で弾道は低伸。仰角で射程が変わる)
const rlFill=document.getElementById('rlfill'),rlTx=document.getElementById('rltx');let rlKey='';
function reloadHud(){ // 装填メーター(FIREボタンの上)
  const rem=Math.max(0,player.cd),key=rem>0?rem.toFixed(1):'ok';
  if(key===rlKey)return;rlKey=key;
  if(rem>0){rlFill.style.width=((1-rem/LEO.reload)*100)+'%';rlFill.style.background='#ffd36a';rlTx.textContent='装填 '+rem.toFixed(1)+'秒';}
  else{rlFill.style.width='100%';rlFill.style.background='#4f4';rlTx.textContent='装填完了';}
}
function muzzle(t,a,p){const c=Math.cos(p),h=1.5+4.6*c;return {x:t.root.position.x+Math.sin(a)*h,y:t.root.position.y+1.73+Math.sin(p)*4.6,z:t.root.position.z+Math.cos(a)*h};}
function fire(t,owner,spread=0){
  const a=t.aim+spread,p=owner==='p'?aimPitch:0;
  const m=BABYLON.MeshBuilder.CreateSphere('bl',{diameter:.6,segments:8},scene);m.material=matBul;
  const o=muzzle(t,a,p);m.position.set(o.x,o.y,o.z);
  if(owner==='p'){const c=Math.cos(p);bullets.push({mesh:m,vx:Math.sin(a)*c*SHV,vy:Math.sin(p)*SHV,vz:Math.cos(a)*c*SHV,g:SHG,life:6,owner,dmg:LEO.dmg});}
  else bullets.push({mesh:m,vx:Math.sin(a)*35,vy:0,vz:Math.cos(a)*35,g:0,life:2.2,owner});
  flash(o.x,o.y,o.z,.8);
}
const flashMat=new BABYLON.StandardMaterial('fm',scene);flashMat.emissiveColor=new BABYLON.Color3(1,.6,.1);flashMat.disableLighting=true;
function flash(x,y,z,s){
  const m=BABYLON.MeshBuilder.CreateSphere('f',{diameter:s*2,segments:8},scene);m.position.set(x,y,z);
  m.material=flashMat;
  flashes.push({m,t:0,s});
}
function seat(t){ // 地形に合わせて高さと傾きを決める
  const p=t.root.position,h=t.root.rotation.y,fx=Math.sin(h),fz=Math.cos(h),rx=Math.cos(h),rz=-Math.sin(h);
  const hf=gh(p.x+fx*2.6,p.z+fz*2.6),hb=gh(p.x-fx*2.6,p.z-fz*2.6),hr=gh(p.x+rx*1.5,p.z+rz*1.5),hl=gh(p.x-rx*1.5,p.z-rz*1.5);
  p.y=(hf+hb+hr+hl)/4;t.root.rotation.x=-Math.atan2(hf-hb,5.2);t.root.rotation.z=Math.atan2(hr-hl,3);
}
function push(t){ // 障害物・壁との衝突
  const p=t.root.position;
  obs.forEach(o=>{const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),min=o.r+t.r;if(d<min&&d>0){p.x=o.x+dx/d*min;p.z=o.z+dz/d*min;}});
  p.x=Math.max(-B+3,Math.min(B-3,p.x));p.z=Math.max(-B+3,Math.min(B-3,p.z));
}

// 照準(battleship_babylon_v37から移植:赤い輪=着弾予想地点)
const mk=BABYLON.MeshBuilder.CreateTorus("mk",{diameter:3.2,thickness:.55,tessellation:16},scene);
const mkm=new BABYLON.StandardMaterial("mkm",scene);mkm.emissiveColor=new BABYLON.Color3(1,.15,.15);mkm.disableLighting=true;mkm.alpha=.85;mkm.fogEnabled=false;
mk.material=mkm;mk.renderingGroupId=1;mk.isPickable=false;mk.isVisible=false;
function aimPoint(){ // 自弾と同じ放物線・判定で着弾点を求める
  const a=player.aim,p=aimPitch,c=Math.cos(p),o=muzzle(player,a,p),h=1/30;
  let x=o.x,y=o.y,z=o.z,vx=Math.sin(a)*c*SHV,vy=Math.sin(p)*SHV,vz=Math.cos(a)*c*SHV;
  for(let i=0;i<180;i++){
    vy-=SHG*h;x+=vx*h;y+=vy*h;z+=vz*h;
    if(y<=gh(x,z))break;
    if((Math.abs(x)>B||Math.abs(z)>B)&&y<10)break;
    if(obs.some(ob=>y<ob.h&&Math.hypot(x-ob.x,z-ob.z)<ob.r))break;
    if(enemies.some(e=>y<e.root.position.y+3.2&&Math.hypot(x-e.root.position.x,z-e.root.position.z)<2.4))break;
  }
  return {x,z,r:Math.hypot(x-player.root.position.x,z-player.root.position.z)};
}
scene.onBeforeRenderObservable.add(()=>{
  const dt=Math.min(engine.getDeltaTime()/1000,.05);
  if(!player)return;
  if(!over){
    // 戦車操作(カメラ基準で移動)
    let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0),iy=(keys.KeyW?1:0)-(keys.KeyS?1:0);
    if(sl.on){ix=sl.x;iy=sl.y;}
    const mag=Math.min(1,Math.hypot(ix,iy));
    let tv=0; // 目標速度
    if(mag>.1){
      const want=camYaw+Math.atan2(ix,iy),df=nd(want-player.heading);
      player.heading+=Math.max(-1,Math.min(1,df*4))*dt*3;
      tv=LEO.vmax*mag*Math.max(0,Math.cos(df));
    }
    {const r=(tv>player.v?LEO.acc:LEO.dec)*dt;player.v+=Math.max(-r,Math.min(r,tv-player.v));} // 重い車体なので徐々に加減速
    player.root.position.x+=Math.sin(player.heading)*player.v*dt;
    player.root.position.z+=Math.cos(player.heading)*player.v*dt;
    player.root.rotation.y=player.heading;push(player);seat(player);dust.emitter.copyFrom(player.root.position);dust.emitRate=player.v>1.5?(MOBILE?30:60):0;
    // 視点操作(戦車とは独立)
    let vy=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+(keys.KeyE?1:0)-(keys.KeyQ?1:0);
    let vp=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0);
    if(sr.on){vy=sr.x;vp=sr.y;}
    camYaw+=vy*2.4*dt;aimPitch=Math.max(0,Math.min(.35,aimPitch+vp*.25*dt));
    // 砲塔は視点の向きを追う
    player.aim+=Math.max(-1,Math.min(1,nd(camYaw-player.aim)*6))*dt*5;
    player.turret.rotation.y=player.aim-player.heading;
    player.barrel.rotation.x=-aimPitch;
    const shooting=keys.Space||keys.Enter||view.fireHeld||view.fireClick;view.fireClick=false;
    player.cd-=dt;
    if(shooting&&player.cd<=0){fire(player,'p');player.cd=LEO.reload;}
    reloadHud();
    // 敵AI
    enemies.forEach(e=>{
      const p=e.root.position,dx=player.root.position.x-p.x,dz=player.root.position.z-p.z,d=Math.hypot(dx,dz);
      const want=Math.atan2(dx,dz)+(d<22?e.strafe*Math.PI/2.5:0);
      e.heading+=Math.max(-1,Math.min(1,nd(want-e.heading)*3))*dt*1.8;
      const spd=d>26?7:(d<14?-4:3);
      p.x+=Math.sin(e.heading)*spd*dt;p.z+=Math.cos(e.heading)*spd*dt;
      e.root.rotation.y=e.heading;
      enemies.forEach(o=>{if(o!==e){const ox=p.x-o.root.position.x,oz=p.z-o.root.position.z,od=Math.hypot(ox,oz);if(od<5&&od>0){p.x+=ox/od*.1;p.z+=oz/od*.1;}}});
      push(e);seat(e);
      const ta=Math.atan2(dx,dz);e.aim+=Math.max(-1,Math.min(1,nd(ta-e.aim)*4))*dt*2.5;
      e.turret.rotation.y=e.aim-e.heading;
      e.cd-=dt;
      if(e.cd<=0&&d<45&&Math.abs(nd(ta-e.aim))<.15){fire(e,'e',(Math.random()-.5)*.12);e.cd=2+Math.random()*1.5;}
    });
  }
  // 弾
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.vy-=b.g*dt;b.mesh.position.x+=b.vx*dt;b.mesh.position.y+=b.vy*dt;b.mesh.position.z+=b.vz*dt;b.life-=dt;
    let hit=b.life<=0;const bx=b.mesh.position.x,by=b.mesh.position.y,bz=b.mesh.position.z;
    if(by<=gh(bx,bz))hit=true;
    if(!hit&&(Math.abs(bx)>B||Math.abs(bz)>B)&&by<10)hit=true;
    if(!hit)for(const o of obs){if(by<o.h&&Math.hypot(bx-o.x,bz-o.z)<o.r){hit=true;break;}}
    if(!hit&&b.owner==='p'){
      for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];
        if(by<e.root.position.y+3.2&&Math.hypot(bx-e.root.position.x,bz-e.root.position.z)<2.4){
          hit=true;e.hp-=b.dmg||1;
          if(e.hp<=0){flash(e.root.position.x,1.5,e.root.position.z,3);e.root.dispose();enemies.splice(j,1);score+=100;}
          break;}}
    }else if(!hit&&!over){
      if(Math.hypot(bx-player.root.position.x,bz-player.root.position.z)<2.4){
        hit=true;player.hp--;
        if(player.hp<=0){over=true;flash(player.root.position.x,1.5,player.root.position.z,4);
          document.getElementById('msg').textContent='GAME OVER  SCORE '+score;document.getElementById('over').style.display='flex';}
      }
    }
    if(hit){flash(bx,Math.max(.5,by),bz,1.2);b.mesh.dispose();bullets.splice(i,1);hud();}
  }
  for(let i=flashes.length-1;i>=0;i--){
    const f=flashes[i];f.t+=dt;const k=f.t/.35;f.m.scaling.setAll(1+k*1.5);f.m.visibility=Math.max(0,1-k);
    if(k>=1){f.m.dispose();flashes.splice(i,1);}
  }
  if(!over&&enemies.length===0){wave++;player.hp=Math.min(player.max,player.hp+1);spawnEnemies(Math.min(2+wave,10));hud();}
  // 照準リング更新
  if(!over){if(!MOBILE||!apc||(apf=(apf+1)%2)===0)apc=aimPoint();const ap=apc;mk.position.set(ap.x,gh(ap.x,ap.z)+.15,ap.z);mk.scaling.setAll(Math.max(1,ap.r/40));mk.isVisible=true;}else mk.isVisible=false;
  // カメラ追従
  view.pitch=.35+aimPitch*.9;const pp=player.root.position,sx=Math.sin(camYaw),sz=Math.cos(camYaw),cp=Math.cos(view.pitch),D=19;
  {const cx=pp.x-sx*cp*D,cz=pp.z-sz*cp*D;cam.position.set(cx,Math.max(pp.y+1.5+Math.sin(view.pitch)*D,gh(cx,cz)+2.5),cz);}
  cam.setTarget(new BABYLON.Vector3(pp.x+sx*6,pp.y+1.5+aimPitch*30,pp.z+sz*6));
  sun.position.set(pp.x+60,pp.y+120,pp.z+48);
});

document.getElementById('restart').onclick=reset;
await tick(.85,'障害物と敵を配置中');
reset();
await tick(.93,'シェーダーを準備中');
// シェーダー準備が終わらない端末でも止まらないよう、最大4秒で見切って開始する
await Promise.race([new Promise(r=>scene.executeWhenReady(r)),new Promise(r=>setTimeout(r,4000))]);
try{scene.render();}catch(e){showErr(String(e&&e.stack||e));}
await tick(1,'準備完了');
engine.runRenderLoop(()=>scene.render());
addEventListener('resize',()=>{applyRes();engine.resize();});
const ti=document.getElementById('title');ti.style.opacity=0;ti.style.pointerEvents='none';setTimeout(()=>ti.remove(),650);
}
</script>
<script>
window.__engineP=(async()=>{
 if(typeof DecompressionStream==='undefined')throw new Error('このブラウザは圧縮データの展開に未対応です(iOS 16.4以降が必要)');
 const bin=Uint8Array.from(atob(document.getElementById('bz').textContent.trim()),c=>c.charCodeAt(0));
 const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 const sc=document.createElement('script');sc.textContent=txt;document.head.appendChild(sc);
 const st=document.getElementById('stat');if(st)st.textContent='JS OK / BABYLON: '+(typeof BABYLON==='undefined'?'未読込!':'OK '+(BABYLON.Engine.Version||''));
})();
window.__engineP.catch(e=>{const st=document.getElementById('stat');if(st)st.textContent='ERROR: '+e.message;});
</script>
